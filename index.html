<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>XMLHttpRequest Test</title>
  <style>
    body {
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Luc XMLHttpRequest + passs:// Test</h1>

<script>
fetch("file:///etc/passwd")
  .then(r => r.text())
  .then(t => document.body.innerHTML = "<pre>" + t + "</pre>")
  .catch(e => document.body.innerHTML = "Error de lectura");
</script>

</body>
</html>
